# Travel log for the /travel/ page (_pages/travel.md).
# Every count, percentage, list, and map layer on that page is built from this file,
# so recording a new visit only means changing that entry's `visited` flag to true.
#
# states: the 50 U.S. states (DC is not counted). `code` is the USPS abbreviation the map uses.
# national_parks: all 64 U.S. national parks. Names, states/territories, and coordinates
# (approximate park centers) come from Wikipedia, "List of national parks of the United States",
# revision 1383110273 (2026-11-01):
# https://en.wikipedia.org/w/index.php?title=List_of_national_parks_of_the_United_States&oldid=1383110273
# Chiricahua (Arizona) became the 64th national park on October 20, 2026 (nps.gov/chir).
# Parks marked `territory: true` lie outside the 50-state map and are listed below it instead.

